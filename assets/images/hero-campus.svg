<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none" role="img" aria-label="Minimal illustration of campus students sharing a weekend route">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3f6f6"/>
      <stop offset="100%" stop-color="#e8efef"/>
    </linearGradient>
    <linearGradient id="road" x1="240" y1="220" x2="240" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d9e2e3"/>
      <stop offset="100%" stop-color="#c9d5d6"/>
    </linearGradient>
  </defs>

  <rect width="480" height="340" rx="16" fill="url(#sky)"/>

  <!-- Soft sun / afternoon glow -->
  <circle cx="386" cy="78" r="36" fill="#ffffff" opacity="0.72"/>
  <circle cx="386" cy="78" r="22" fill="#e5eff0"/>

  <!-- Distant campus buildings (minimalist geometry) -->
  <rect x="44" y="136" width="84" height="92" rx="6" fill="#dce4e5"/>
  <rect x="58" y="152" width="16" height="18" rx="2" fill="#f8f8f7" opacity="0.8"/>
  <rect x="84" y="152" width="16" height="18" rx="2" fill="#f8f8f7" opacity="0.8"/>
  <rect x="58" y="182" width="16" height="18" rx="2" fill="#f8f8f7" opacity="0.8"/>
  <rect x="84" y="182" width="16" height="18" rx="2" fill="#f8f8f7" opacity="0.8"/>

  <rect x="138" y="114" width="112" height="114" rx="6" fill="#cfdadd"/>
  <rect x="156" y="134" width="22" height="12" rx="2" fill="#f8f8f7" opacity="0.75"/>
  <rect x="190" y="134" width="22" height="12" rx="2" fill="#f8f8f7" opacity="0.75"/>
  <rect x="156" y="158" width="22" height="12" rx="2" fill="#f8f8f7" opacity="0.75"/>
  <rect x="190" y="158" width="22" height="12" rx="2" fill="#f8f8f7" opacity="0.75"/>
  <path d="M180 228v-32a14 14 0 0 1 28 0v32h-28Z" fill="#b7c6ca"/>

  <!-- Soft trees -->
  <circle cx="318" cy="174" r="32" fill="#c6d6d2"/>
  <circle cx="352" cy="184" r="26" fill="#b7cbc6"/>
  <rect x="316" y="196" width="4" height="32" rx="2" fill="#8ea3a0"/>
  <rect x="350" y="202" width="4" height="26" rx="2" fill="#8ea3a0"/>

  <!-- Curved campus avenue -->
  <path d="M0 228h480v112H0V228Z" fill="url(#road)"/>
  <path d="M0 228h480" stroke="#b9c7c9" stroke-width="1.5"/>
  <path d="M24 282h432" stroke="#f8f8f7" stroke-width="2" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.85"/>

  <!-- Minimalist sedan -->
  <g transform="translate(154, 198)">
    <ellipse cx="92" cy="58" rx="82" ry="7" fill="#9fb0b3" opacity="0.45"/>
    <path d="M18 38c3-14 18-26 38-28h56c20 0 36 10 46 24l18 4c8 2 12 7 12 14v4c0 3-2 5-5 5H13c-4 0-7-3-7-7v-7c0-5 5-8 12-9Z" fill="#1e5b63"/>
    <path d="M52 14h54c14 0 26 7 34 18H40c4-10 8-16 12-18Z" fill="#d9eaec"/>
    <rect x="86" y="14" width="3" height="18" fill="#1e5b63"/>
    <circle cx="46" cy="56" r="13" fill="#182226"/>
    <circle cx="46" cy="56" r="6" fill="#cfdadd"/>
    <circle cx="144" cy="56" r="13" fill="#182226"/>
    <circle cx="144" cy="56" r="6" fill="#cfdadd"/>
  </g>

  <!-- Floating route arc connecting campus to home city -->
  <path d="M96 92C168 38 308 38 382 96" stroke="#1e5b63" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <circle cx="96" cy="92" r="7" fill="#ffffff" stroke="#1e5b63" stroke-width="2.5"/>
  <circle cx="382" cy="96" r="7" fill="#1e5b63"/>

  <!-- Peer avatars converging along route -->
  <g transform="translate(198, 36)">
    <rect x="0" y="0" width="84" height="32" rx="16" fill="#ffffff" stroke="#d5dfe0" stroke-width="1"/>
    <circle cx="20" cy="16" r="9" fill="#d8e9eb"/>
    <circle cx="20" cy="14" r="3" fill="#1e5b63"/>
    <path d="M14 22c1.5-3 10.5-3 12 0" stroke="#1e5b63" stroke-width="1.6" stroke-linecap="round"/>

    <circle cx="42" cy="16" r="9" fill="#e5ecea"/>
    <circle cx="42" cy="14" r="3" fill="#1e5b63"/>
    <path d="M36 22c1.5-3 10.5-3 12 0" stroke="#1e5b63" stroke-width="1.6" stroke-linecap="round"/>

    <circle cx="64" cy="16" r="9" fill="#d8e9eb"/>
    <circle cx="64" cy="14" r="3" fill="#1e5b63"/>
    <path d="M58 22c1.5-3 10.5-3 12 0" stroke="#1e5b63" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
