<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusRide — Shared Student Travel</title>
  <meta name="description" content="Find your route. Find your people. Share the journey. Discover fellow students heading in the same direction around the same time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="container header-inner">
        <a href="#landing" class="brand" data-nav="landing" aria-label="CampusRide home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="18" r="2.5"></circle>
              <circle cx="18" cy="6" r="2.5"></circle>
              <path d="M8.5 17.5C13 17.5 11 6.5 15.5 6.5"></path>
            </svg>
          </span>
          <span class="brand-name">CampusRide</span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <button type="button" class="nav-link" data-nav="plan">Plan a ride</button>
          <button type="button" class="nav-link" data-nav="matches">Matches</button>
          <button type="button" class="nav-link" data-nav="profile">Profile</button>
          <button type="button" class="nav-link" data-nav="landing" id="header-search-btn" aria-label="Search cities">Search City</button>
          <div class="appearance-wrap">
            <button
              type="button"
              class="appearance-trigger"
              id="appearance-toggle"
              aria-label="Personalize appearance"
              aria-expanded="false"
              aria-controls="appearance-popover"
              title="Personalize colours &amp; typography"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
              </svg>
            </button>
            <div
              class="appearance-popover"
              id="appearance-popover"
              role="dialog"
              aria-label="Personalize appearance"
              hidden
            ></div>
          </div>
        </nav>
      </div>
    </header>

    <main id="app-main" class="app-main" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-brand">CampusRide · Student-to-student route discovery</p>
        <p class="footer-disclaimer">Estimates only. CampusRide does not book cabs or verify identity.</p>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
